name: RAG Service

on:
  pull_request:
    branches: [main]
    paths: [rag-service/**]
  push:
    branches: [main]
    paths: [rag-service/**]

jobs:
  lint-and-test:
    name: RAG Service — lint & test
    uses: ./.github/workflows/python-lint-test.yml
    with:
      directory: rag-service
      env-vars: >-
        {
          "DATABASE_URL": "postgresql://x:x@localhost/x",
          "AWS_REGION": "us-east-1",
          "S3_BUCKET_NAME": "test",
          "SQS_QUEUE_URL": "",
          "BEDROCK_EMBEDDING_MODEL_ID": "test"
        }

  docker:
    needs: lint-and-test
    uses: ./.github/workflows/docker-build.yml
    with:
      directory: rag-service
      ecr-repo: kbqa-rag
      aws-region: eu-west-1
      role-to-assume: arn:aws:iam::381665779871:role/kbqa-deployment-role
      publish: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
